<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>מקרר</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="kitchen.css?v=53">
</head>
<body>
  <div id="bar">
    <button id="backbtn" onclick="goBack()" hidden>→ חזרה</button>
    <!-- רשימה + מתכונים live INSIDE the bar card. They used to float over the stage,
         which is why the stage had to reserve a wide left gutter on every screen. -->
    <div id="barcircles">
      <button id="listbtn" onclick="openListScreen()" title="רשימת קניות">
        <span class="lb-cap">רשימה</span>
        <span class="lb-count" id="lb-count">0</span>
        <span class="lb-date" id="lb-date"></span>
      </button>
      <button id="recipebtn" onclick="openRecipes()" title="מתכונים">
        <span class="lb-cap">מתכונים</span>
      </button>
    </div>
    <div id="title">🧊 מקרר</div>
  </div>

  <div id="stage">
    <div id="circles"></div>
  </div>

  <!-- product panel: opens on the RIGHT of the same screen -->
  <!-- recipes of one category: same right-side panel shape as a product, so it covers part of
       the screen with the flying categories still visible behind it -->
  <div id="recipepanel" hidden>
    <div class="pp-backdrop" onclick="closeRecipeCat()"></div>
    <div class="pp-inner">
      <button class="pp-close" onclick="closeRecipeCat()">✕</button>
      <div id="rp-title" class="rp-title"></div>
      <div id="rp-list" class="rp-list"></div>
    </div>
  </div>

  <div id="prodpanel" hidden>
    <div class="pp-backdrop" onclick="closeProduct()"></div>
    <div class="pp-inner">
      <button class="pp-close" onclick="closeProduct()">✕</button>
      <div id="pp-stage"></div>
      <div id="pp-toast">✓ נוסף לרשימה</div>
    </div>
  </div>

  <!-- shopping list screen -->
  <div id="listview" hidden>
    <div class="lv-bar">
      <button class="lv-back" onclick="closeListScreen()">→ חזרה</button>
      <div class="lv-title">🧺 רשימת קניות</div>
      <div class="lv-left">
        <div class="lv-total" id="lv-total">מחיר 0 שיח</div>
        <button class="lv-clear" onclick="clearListAll()">🗑 נקה הכל</button>
      </div>
    </div>
    <div id="lv-items"></div>
  </div>

  <script src="kitchen.js?v=39"></script>
</body>
</html>
