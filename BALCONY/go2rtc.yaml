# go2rtc camera relay for the balcony Logitech C925e — deployed to the PROXMOX HOST
# (192.168.1.101) at /opt/go2rtc/go2rtc.yaml (the USB webcam is plugged into the host,
# which sits near the balcony). Started by go2rtc.service. Consumed by the dashboard's
# Balcony agent -> Camera tab.
#
# The C925e has NO H.264 (verified: MJPG/YUY2 only) and its mic is an odd 32 kHz stereo
# USB-audio (card 0). Three separate producers keep video reliable + audio clean:
#   1) RAW video device (MJPEG) -> served straight to the <img> card (ZERO transcode):
#        http://192.168.1.101:1984/api/stream.mjpeg?src=balcony_cam
#   2) ALSA mic (plughw:0) -> mono + high-pass(85Hz) + FFT denoise -> Opus (for WebRTC "Listen").
#   3) LAZY H.264 transcode of the stream -> spun up ONLY when a WebRTC client needs video.
# ⚠ Combining video+audio in ONE ffmpeg:device source silently DROPPED the mic — that is
#   why audio is a SEPARATE producer. And do NOT add #video=mjpeg#video=h264 hints to the
#   raw video source — that breaks the MJPEG passthrough (blank picture).
# ⚠ /dev/video0 + hw:0 assume the C925e is the only USB cam/audio on the host.
streams:
  balcony_cam:
    - "ffmpeg:device?video=/dev/video0&input_format=mjpeg&video_size=1280x720&framerate=30"
    - "ffmpeg:device?audio=plughw:0#audio=opus#raw=-ac 1 -af highpass=f=85,afftdn=nf=-25"
    - "ffmpeg:balcony_cam#video=h264"
api:
  origin: "*"          # so the dashboard (different origin) can do the WebRTC offer/answer fetch
  listen: ":1984"
rtsp:
  listen: ":8554"
webrtc:
  listen: ":8555"
log:
  level: info
