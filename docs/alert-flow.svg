<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif">

  <rect width="1100" height="720" fill="#f5f2ee"/>

  <!-- Title -->
  <text x="550" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#3a3028">Alert System — How Problems Are Caught &amp; Shown</text>
  <text x="550" y="54" text-anchor="middle" font-size="11" fill="#888">Two independent layers: Orchestrator (agent health) + Dashboard (infrastructure)</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- COLUMN 1 — ORCHESTRATOR LAYER -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Header band -->
  <rect x="30" y="70" width="480" height="36" rx="6" fill="#2c4a6e"/>
  <text x="270" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">ORCHESTRATOR LAYER — runs on LXC 105</text>

  <!-- Timers box -->
  <rect x="30" y="118" width="220" height="58" rx="6" fill="#fff" stroke="#b0c8e8" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#2c4a6e">main-agent.timer</text>
  <text x="140" y="156" text-anchor="middle" font-size="10" fill="#666">Full check — every 1 hour</text>
  <text x="140" y="169" text-anchor="middle" font-size="10" fill="#666">SSH + agent errors + retention</text>

  <rect x="290" y="118" width="220" height="58" rx="6" fill="#fff" stroke="#b0c8e8" stroke-width="1.5"/>
  <text x="400" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#2c4a6e">main-agent-quick.timer</text>
  <text x="400" y="156" text-anchor="middle" font-size="10" fill="#666">Quick check — every 5 min</text>
  <text x="400" y="169" text-anchor="middle" font-size="10" fill="#666">Schedule + data freshness only</text>

  <!-- What it checks -->
  <rect x="30" y="192" width="480" height="138" rx="6" fill="#eef4fb" stroke="#b0c8e8" stroke-width="1.5"/>
  <text x="270" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#2c4a6e">What Orchestrator checks:</text>

  <!-- check items -->
  <circle cx="54" cy="228" r="4" fill="#5a8ab0"/>
  <text x="64" y="232" font-size="10" fill="#444">Agent schedule overdue (next_ts &gt; 5 min past)</text>
  <circle cx="54" cy="246" r="4" fill="#5a8ab0"/>
  <text x="64" y="250" font-size="10" fill="#444">ERR: rows in agent_boiler_data (last 10 rows)</text>
  <circle cx="54" cy="264" r="4" fill="#5a8ab0"/>
  <text x="64" y="268" font-size="10" fill="#444">boiler-agent service active on LXC 103 (SSH)</text>
  <circle cx="54" cy="282" r="4" fill="#5a8ab0"/>
  <text x="64" y="286" font-size="10" fill="#444">main-agent timers active on LXC 105 (SSH)</text>
  <circle cx="54" cy="300" r="4" fill="#5a8ab0"/>
  <text x="64" y="304" font-size="10" fill="#444">raw_data age &gt; 15 min → ha_to_pg failing</text>
  <circle cx="54" cy="318" r="4" fill="#5a8ab0"/>
  <text x="64" y="322" font-size="10" fill="#444">raw_weather age &gt; 35 min → collect_weather failing</text>

  <!-- Arrow down to system_alerts -->
  <line x1="270" y1="330" x2="270" y2="362" stroke="#2c4a6e" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="278" y="350" font-size="10" fill="#2c4a6e">raises / resolves alert</text>

  <!-- system_alerts DB table -->
  <rect x="100" y="362" width="340" height="56" rx="6" fill="#1e4a6e" stroke="#1e4a6e" stroke-width="1.5"/>
  <text x="270" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">🗄 system_alerts (PostgreSQL)</text>
  <text x="270" y="402" text-anchor="middle" font-size="10" fill="#b0d0ee">alert_type · severity · affected_agent · resolved_at</text>
  <text x="270" y="414" text-anchor="middle" font-size="10" fill="#b0d0ee">auto-resolved on next run when condition clears</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- COLUMN 2 — DASHBOARD DIRECT LAYER -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Header band -->
  <rect x="590" y="70" width="480" height="36" rx="6" fill="#4a6e3a"/>
  <text x="830" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">DASHBOARD DIRECT LAYER — runs on Windows host</text>

  <!-- Background refresh box -->
  <rect x="590" y="118" width="480" height="36" rx="6" fill="#fff" stroke="#b0d0a0" stroke-width="1.5"/>
  <text x="830" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#4a6e3a">Background check — every 60 seconds (server.js)</text>

  <!-- What it checks -->
  <rect x="590" y="166" width="480" height="164" rx="6" fill="#eef5eb" stroke="#b0d0a0" stroke-width="1.5"/>
  <text x="830" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#4a6e3a">What Dashboard checks directly:</text>

  <!-- Infrastructure -->
  <text x="610" y="206" font-size="10" font-weight="600" fill="#4a6e3a">Infrastructure</text>
  <circle cx="614" cy="220" r="3.5" fill="#5a9a4a"/>
  <text x="624" y="224" font-size="10" fill="#444">PostgreSQL — db.query('SELECT 1')</text>
  <circle cx="614" cy="236" r="3.5" fill="#5a9a4a"/>
  <text x="624" y="240" font-size="10" fill="#444">Home Assistant — HTTP GET /api/</text>

  <!-- VM + LXC -->
  <text x="610" y="258" font-size="10" font-weight="600" fill="#4a6e3a">VM + LXC (TCP port check)</text>
  <circle cx="614" cy="272" r="3.5" fill="#5a9a4a"/>
  <text x="624" y="276" font-size="10" fill="#444">VM 101 (HA) port 8123 · LXC 100, 102, 103, 104, 105, 106 port 22</text>

  <!-- Server -->
  <text x="610" y="295" font-size="10" font-weight="600" fill="#4a6e3a">Server</text>
  <circle cx="614" cy="309" r="3.5" fill="#5a9a4a"/>
  <text x="624" y="313" font-size="10" fill="#444">PM2 — jlist all processes online</text>

  <!-- Scripts freshness -->
  <text x="610" y="323" font-size="10" font-weight="600" fill="#4a6e3a">Data freshness (DB query)</text>
  <text x="624" y="336" font-size="10" fill="#444">ha_to_pg (&lt;15 min) · collect_weather (&lt;35 min) · Boiler decision · Orch last run</text>

  <!-- Arrow down -->
  <line x1="830" y1="330" x2="830" y2="362" stroke="#4a6e3a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="838" y="350" font-size="10" fill="#4a6e3a">result stored in memory cache</text>

  <!-- statusCache box -->
  <rect x="660" y="362" width="340" height="56" rx="6" fill="#2e5a20" stroke="#2e5a20" stroke-width="1.5"/>
  <text x="830" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">⚡ statusCache (server memory)</text>
  <text x="830" y="402" text-anchor="middle" font-size="10" fill="#b0e0a0">Updated every 60s — served instantly to browser</text>
  <text x="830" y="414" text-anchor="middle" font-size="10" fill="#b0e0a0">Independent — works even if DB is down</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- BOTTOM — HOW BROWSER SEES IT -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Arrow from system_alerts to browser -->
  <line x1="270" y1="418" x2="270" y2="490" stroke="#2c4a6e" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="196" y="460" font-size="10" fill="#2c4a6e">GET /api/health/status</text>
  <text x="196" y="474" font-size="10" fill="#2c4a6e">reads active_alerts count</text>

  <!-- Arrow from statusCache to browser -->
  <line x1="830" y1="418" x2="830" y2="490" stroke="#4a6e3a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="838" y="455" font-size="10" fill="#4a6e3a">GET /api/health/status</text>
  <text x="838" y="469" font-size="10" fill="#4a6e3a">returns direct check results</text>

  <!-- Both merge arrow -->
  <line x1="440" y1="490" x2="660" y2="490" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="550" y="483" text-anchor="middle" font-size="10" fill="#888">merged in single API response</text>

  <!-- Browser / Dashboard box -->
  <rect x="340" y="490" width="420" height="80" rx="8" fill="#fff" stroke="#c0a060" stroke-width="2"/>
  <text x="550" y="515" text-anchor="middle" font-size="13" font-weight="600" fill="#7a5a20">🖥 Dashboard (browser)</text>

  <rect x="360" y="525" width="120" height="30" rx="4" fill="#f5f0e8" stroke="#c0a060" stroke-width="1"/>
  <text x="420" y="543" text-anchor="middle" font-size="10" fill="#7a5a20">System Status tab</text>
  <text x="420" y="555" text-anchor="middle" font-size="9" fill="#aaa">⬤ per item</text>

  <rect x="500" y="525" width="120" height="30" rx="4" fill="#f5f0e8" stroke="#c0a060" stroke-width="1"/>
  <text x="560" y="543" text-anchor="middle" font-size="10" fill="#7a5a20">Data — Active Alerts</text>
  <text x="560" y="555" text-anchor="middle" font-size="9" fill="#aaa">Orchestrator verdict</text>

  <rect x="640" y="525" width="100" height="30" rx="4" fill="#f5f0e8" stroke="#c0a060" stroke-width="1"/>
  <text x="690" y="543" text-anchor="middle" font-size="10" fill="#7a5a20">Alerts tab</text>
  <text x="690" y="555" text-anchor="middle" font-size="9" fill="#aaa">full alert list</text>

  <!-- Red icon -->
  <rect x="340" y="590" width="420" height="50" rx="8" fill="#7a2020" stroke="#7a2020"/>
  <text x="550" y="615" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">⚠ Sidebar Red Blinking Icon</text>
  <text x="550" y="631" text-anchor="middle" font-size="10" fill="#ffcccc">Fires when ANY check = false (direct or orchestrator) · Sound alert on new problem</text>

  <!-- Arrow browser to red icon -->
  <line x1="550" y1="570" x2="550" y2="590" stroke="#c04040" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- FAILURE SAFETY NOTE -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="655" width="1040" height="50" rx="6" fill="#fff8e8" stroke="#c0a060" stroke-width="1.5"/>
  <text x="550" y="675" text-anchor="middle" font-size="11" font-weight="600" fill="#7a5a20">Failure Safety</text>
  <text x="550" y="693" text-anchor="middle" font-size="10" fill="#666">If DB goes down → Dashboard direct checks still catch it (TCP + PM2) · If Orchestrator goes down → Dashboard catches it via orchestrator_last_run freshness check</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2c4a6e"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a6e3a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c04040"/>
    </marker>
  </defs>

</svg>
