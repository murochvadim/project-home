<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1120" height="700" fill="#f5f2ee"/>
  <defs>
    <marker id="a"  markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#888"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#5a8a58"/></marker>
    <marker id="ap" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#5a7a9a"/></marker>
  </defs>

  <text x="560" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#3a3028">Boiler Agent — 3 · Turn ON &amp; Probe</text>
  <text x="560" y="48" text-anchor="middle" font-size="10" fill="#888">Entered when valve is OFF. Two paths: normal turn-on (valid reading) vs probe (invalid reading).</text>

  <!-- ENTER -->
  <rect x="360" y="62" width="400" height="36" rx="18" fill="#1e2a3a"/>
  <text x="560" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Valve is OFF</text>
  <line x1="560" y1="98" x2="560" y2="122" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Panel reading VALID? -->
  <rect x="300" y="122" width="520" height="60" rx="6" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1.5"/>
  <text x="560" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">◆  Panel reading VALID?</text>
  <text x="560" y="166" text-anchor="middle" font-size="10" fill="#555">valve OFF less than panel_temp_valid_after_off minutes ago?</text>

  <!-- ════ LEFT (Valid) ════ -->
  <line x1="300" y1="152" x2="240" y2="152" stroke="#5a8a58" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="268" y="144" text-anchor="middle" font-size="9" fill="#5a8a58">Valid</text>

  <!-- Within hours? (valid) -->
  <rect x="30" y="122" width="210" height="60" rx="6" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1.5"/>
  <text x="135" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">◆  07:00 – 19:00?</text>
  <text x="135" y="166" text-anchor="middle" font-size="10" fill="#555">operational hours</text>

  <!-- No ↓ no_action -->
  <line x1="135" y1="182" x2="135" y2="212" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="146" y="202" font-size="9" fill="#555">No</text>
  <rect x="30" y="212" width="210" height="60" rx="6" fill="#d0cbc4" stroke="#a8a09a" stroke-width="1.5"/>
  <text x="135" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">decision = no_action</text>
  <text x="135" y="256" text-anchor="middle" font-size="10" fill="#555">outside hours</text>

  <!-- Yes (valid + hours) → down-left then to temp check -->
  <line x1="30" y1="152" x2="14" y2="152" stroke="#5a8a58" stroke-width="1.5"/>
  <line x1="14" y1="152" x2="14" y2="310" stroke="#5a8a58" stroke-width="1.5"/>
  <line x1="14" y1="310" x2="240" y2="310" stroke="#5a8a58" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="6" y="238" font-size="9" fill="#5a8a58" text-anchor="middle" transform="rotate(-90,6,238)">Yes</text>

  <!-- panel_temp > boiler_temp + debounce? -->
  <rect x="240" y="284" width="300" height="60" rx="6" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1.5"/>
  <text x="390" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">◆  panel_temp &gt; boiler_temp</text>
  <text x="390" y="328" text-anchor="middle" font-size="10" fill="#555">+ temp_debounce?</text>

  <!-- Yes → turn_on -->
  <line x1="390" y1="344" x2="390" y2="374" stroke="#5a8a58" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="401" y="364" font-size="9" fill="#5a8a58">Yes</text>
  <rect x="240" y="374" width="300" height="60" rx="6" fill="#8a9f78" stroke="#6a7f58" stroke-width="1.5"/>
  <text x="390" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">decision = turn_on</text>
  <text x="390" y="418" text-anchor="middle" font-size="10" fill="#dff0d8">Panel warm → Waiting Phase (SVG 2)</text>

  <!-- No → no_action -->
  <line x1="540" y1="314" x2="596" y2="314" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="568" y="306" text-anchor="middle" font-size="9" fill="#555">No</text>
  <rect x="596" y="284" width="200" height="60" rx="6" fill="#d0cbc4" stroke="#a8a09a" stroke-width="1.5"/>
  <text x="696" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">decision = no_action</text>
  <text x="696" y="328" text-anchor="middle" font-size="10" fill="#555">panel not warm enough</text>

  <!-- ════ RIGHT (Invalid) ════ -->
  <line x1="820" y1="152" x2="876" y2="152" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="848" y="144" text-anchor="middle" font-size="9" fill="#555">Invalid</text>

  <!-- Within hours? (invalid) -->
  <rect x="876" y="122" width="214" height="60" rx="6" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1.5"/>
  <text x="983" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">◆  07:00 – 19:00?</text>
  <text x="983" y="166" text-anchor="middle" font-size="10" fill="#555">operational hours</text>

  <!-- No ↓ no_action -->
  <line x1="983" y1="182" x2="983" y2="212" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="994" y="202" font-size="9" fill="#555">No</text>
  <rect x="876" y="212" width="214" height="60" rx="6" fill="#d0cbc4" stroke="#a8a09a" stroke-width="1.5"/>
  <text x="983" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">decision = no_action</text>
  <text x="983" y="256" text-anchor="middle" font-size="10" fill="#555">outside hours</text>

  <!-- Yes → Probe feasible? (route down the right side) -->
  <line x1="1090" y1="152" x2="1106" y2="152" stroke="#888" stroke-width="1.5"/>
  <line x1="1106" y1="152" x2="1106" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="1106" y1="300" x2="1090" y2="300" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1106" y="230" font-size="9" fill="#555" text-anchor="start"> Yes</text>

  <!-- Probe feasible? -->
  <rect x="876" y="274" width="214" height="60" rx="6" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1.5"/>
  <text x="983" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">◆  Probe feasible?</text>
  <text x="983" y="318" text-anchor="middle" font-size="10" fill="#555">minutes to 19:00 ≥ probe_cost_min?</text>

  <!-- No → no_action (too late) -->
  <line x1="983" y1="334" x2="983" y2="374" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="994" y="360" font-size="9" fill="#555">No</text>
  <rect x="876" y="374" width="214" height="60" rx="6" fill="#d0cbc4" stroke="#a8a09a" stroke-width="1.5"/>
  <text x="983" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">decision = no_action</text>
  <text x="983" y="418" text-anchor="middle" font-size="10" fill="#555">too late to complete probe</text>

  <!-- Yes → Probe timer elapsed? -->
  <line x1="876" y1="304" x2="820" y2="304" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="848" y="296" text-anchor="middle" font-size="9" fill="#555">Yes</text>

  <!-- Probe timer elapsed? -->
  <rect x="616" y="274" width="204" height="60" rx="6" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1.5"/>
  <text x="718" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">◆  Probe timer elapsed?</text>
  <text x="718" y="318" text-anchor="middle" font-size="10" fill="#555">time since last close ≥ probe_interval_min?</text>

  <!-- No → no_action -->
  <line x1="718" y1="334" x2="718" y2="374" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="729" y="360" font-size="9" fill="#555">No</text>
  <rect x="616" y="374" width="204" height="60" rx="6" fill="#d0cbc4" stroke="#a8a09a" stroke-width="1.5"/>
  <text x="718" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#2e2e2e">decision = no_action</text>
  <text x="718" y="418" text-anchor="middle" font-size="10" fill="#555">probe timer not elapsed yet</text>

  <!-- Yes → PROBE turn_on -->
  <line x1="616" y1="304" x2="560" y2="304" stroke="#5a7a9a" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="588" y="296" text-anchor="middle" font-size="9" fill="#5a7a9a">Yes</text>
  <rect x="400" y="274" width="216" height="60" rx="6" fill="#97b3cc" stroke="#7a9ab8" stroke-width="1.5"/>
  <text x="508" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">decision = turn_on</text>
  <text x="508" y="318" text-anchor="middle" font-size="10" fill="#dce9f5">PROBE — open valve to read panel</text>

  <!-- ── Convergence ── -->
  <!-- All outcomes down to gather at y=568 -->
  <!-- Left side: no_action (hours, valid) center x=135, bottom=272 -->
  <line x1="135" y1="272" x2="135" y2="568" stroke="#888" stroke-width="1.5"/>
  <!-- turn_on (valid) center x=390, bottom=434 -->
  <line x1="390" y1="434" x2="390" y2="568" stroke="#888" stroke-width="1.5"/>
  <!-- PROBE turn_on center x=508, bottom=334 -->
  <line x1="508" y1="334" x2="508" y2="568" stroke="#888" stroke-width="1.5"/>
  <!-- no_action (not warm) center x=696, bottom=344 -->
  <line x1="696" y1="344" x2="696" y2="568" stroke="#888" stroke-width="1.5"/>
  <!-- no_action (timer) center x=718, bottom=434 -->
  <line x1="718" y1="434" x2="718" y2="568" stroke="#888" stroke-width="1.5"/>
  <!-- no_action (too late) center x=983, bottom=434 -->
  <line x1="983" y1="434" x2="983" y2="568" stroke="#888" stroke-width="1.5"/>
  <!-- no_action (hours, invalid) center x=983, bottom=272 — same x track -->
  <line x1="983" y1="272" x2="983" y2="568" stroke="#888" stroke-width="0"/><!-- covered by above -->

  <!-- Gather line -->
  <line x1="135" y1="568" x2="983" y2="568" stroke="#888" stroke-width="1.5"/>
  <line x1="560" y1="568" x2="560" y2="584" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- EXIT -->
  <rect x="300" y="584" width="520" height="36" rx="18" fill="#1e2a3a"/>
  <text x="560" y="607" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">⏹ Write DB · Enter Waiting Phase if turn_on · Sleep</text>

  <!-- Note -->
  <rect x="20" y="634" width="1080" height="52" rx="6" fill="#fff8e8" stroke="#c0a060" stroke-width="1.5"/>
  <text x="560" y="654" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a20">probe_cost_min = panel_valid_after_on + (trend_runs + 1) × run_interval_min</text>
  <text x="560" y="674" text-anchor="middle" font-size="10" fill="#666">Probe timer resets on every valve close — after each turn_off the agent waits probe_interval_min before probing again</text>
</svg>
