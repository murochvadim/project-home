<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="950" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#888"/>
    </marker>
    <marker id="ad" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b55e5e"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#5a8a58"/>
    </marker>
    <marker id="ab" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#5a7a9a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1220" height="950" fill="#f5f2ee"/>

  <!-- Title -->
  <text x="555" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e2a3a">Media Ingest Flow — Engines</text>

  <!-- ═══════════════════════════════════════════
       START pill
  ═══════════════════════════════════════════ -->
  <rect x="380" y="36" width="350" height="34" rx="18" fill="#1e2a3a"/>
  <text x="555" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="white">📥  File Uploaded</text>

  <!-- arrow START → Box1 -->
  <line x1="555" y1="70" x2="555" y2="87" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       Box 1 — SHA256 Hash
  ═══════════════════════════════════════════ -->
  <rect x="290" y="88" width="530" height="58" fill="#e8ddd8" stroke="#d0cbc4" stroke-width="1.5" rx="4"/>
  <text x="555" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Compute file hash</text>
  <text x="555" y="131" text-anchor="middle" font-size="11" fill="#666">Node.js crypto  ·  SHA256</text>

  <!-- arrow Box1 → Decision2 -->
  <line x1="555" y1="146" x2="555" y2="153" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       Decision 2 — Duplicate?
       center=(555,183)  diamond half-w=120 half-h=30
  ═══════════════════════════════════════════ -->
  <polygon points="555,153 675,183 555,213 435,183" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1.5"/>
  <text x="555" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Duplicate?</text>

  <!-- No label + arrow down -->
  <text x="568" y="231" font-size="11" fill="#888">No</text>
  <line x1="555" y1="213" x2="555" y2="229" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Yes label + arrow right to red box -->
  <text x="680" y="179" font-size="11" fill="#b55e5e">Yes</text>
  <line x1="675" y1="183" x2="894" y2="183" stroke="#b55e5e" stroke-width="1.5" marker-end="url(#ad)"/>

  <!-- Right col — Duplicate skip (red) -->
  <rect x="900" y="154" width="240" height="58" fill="#b55e5e" stroke="#954040" stroke-width="1.5" rx="4"/>
  <text x="1020" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Skip — already exists</text>
  <text x="1020" y="197" text-anchor="middle" font-size="11" fill="#ffe0e0">no action taken</text>

  <!-- ═══════════════════════════════════════════
       Box 3 — Detect file type
  ═══════════════════════════════════════════ -->
  <rect x="290" y="230" width="530" height="58" fill="#e8ddd8" stroke="#d0cbc4" stroke-width="1.5" rx="4"/>
  <text x="555" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Detect file type</text>
  <text x="555" y="273" text-anchor="middle" font-size="11" fill="#666">mime  ·  file extension</text>

  <!-- arrow Box3 → Decision4 -->
  <line x1="555" y1="288" x2="555" y2="295" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       Decision 4 — Audio only?
       center=(555,325)
  ═══════════════════════════════════════════ -->
  <polygon points="555,295 675,325 555,355 435,325" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1.5"/>
  <text x="555" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Audio only?</text>

  <!-- No label + arrow down -->
  <text x="568" y="374" font-size="11" fill="#888">No</text>
  <line x1="555" y1="355" x2="555" y2="370" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Yes label + arrow right to grey box -->
  <text x="680" y="321" font-size="11" fill="#666">Yes</text>
  <line x1="675" y1="325" x2="894" y2="325" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Right col — Audio sound (grey) -->
  <rect x="900" y="296" width="240" height="58" fill="#d0cbc4" stroke="#a8a09a" stroke-width="1.5" rx="4"/>
  <text x="1020" y="319" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">category = 'sound'</text>
  <text x="1020" y="339" text-anchor="middle" font-size="11" fill="#555">skip face recognition</text>

  <!-- Audio bypass route → INSERT: right edge (1140,325) → (1165,325) → (1165,771) → (820,771) -->
  <polyline points="1140,325 1165,325 1165,771" stroke="#888" stroke-width="1.5" fill="none"/>

  <!-- ═══════════════════════════════════════════
       Box 5 — Parse filename (Haiku)
  ═══════════════════════════════════════════ -->
  <rect x="290" y="371" width="530" height="58" fill="#e8ddd8" stroke="#d0cbc4" stroke-width="1.5" rx="4"/>
  <text x="555" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Parse filename + folder path</text>
  <text x="555" y="414" text-anchor="middle" font-size="11" fill="#666">Claude Haiku  ·  title / year / event / location / category</text>

  <!-- arrow Box5 → Box6 -->
  <line x1="555" y1="429" x2="555" y2="447" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       Box 6 — Transliterate (Haiku)
  ═══════════════════════════════════════════ -->
  <rect x="290" y="448" width="530" height="58" fill="#e8ddd8" stroke="#d0cbc4" stroke-width="1.5" rx="4"/>
  <text x="555" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Transliterate → English search_text</text>
  <text x="555" y="491" text-anchor="middle" font-size="11" fill="#666">Claude Haiku  ·  Hebrew / Russian → English</text>

  <!-- arrow Box6 → Box7 -->
  <line x1="555" y1="506" x2="555" y2="524" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       Box 7 — Sample frames (FFmpeg)
  ═══════════════════════════════════════════ -->
  <rect x="290" y="525" width="530" height="58" fill="#e8ddd8" stroke="#d0cbc4" stroke-width="1.5" rx="4"/>
  <text x="555" y="548" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Sample frames (video) or use image directly</text>
  <text x="555" y="568" text-anchor="middle" font-size="11" fill="#666">FFmpeg  ·  1 frame / 2 min  ·  skip first + last 10 sec</text>

  <!-- arrow Box7 → Box8 -->
  <line x1="555" y1="583" x2="555" y2="601" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       Box 8 — InsightFace
  ═══════════════════════════════════════════ -->
  <rect x="290" y="602" width="530" height="58" fill="#e8ddd8" stroke="#d0cbc4" stroke-width="1.5" rx="4"/>
  <text x="555" y="625" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Detect + match faces against registry</text>
  <text x="555" y="645" text-anchor="middle" font-size="11" fill="#666">InsightFace buffalo_sc  ·  cosine similarity ≥ 0.5  ·  LXC 100</text>

  <!-- arrow Box8 → Decision9 -->
  <line x1="555" y1="660" x2="555" y2="667" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       Decision 9 — Faces matched?
       center=(555,697)
  ═══════════════════════════════════════════ -->
  <polygon points="555,667 675,697 555,727 435,697" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1.5"/>
  <text x="555" y="701" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Faces matched?</text>

  <!-- Yes label + arrow down -->
  <text x="568" y="746" font-size="11" fill="#5a8a58">Yes</text>
  <line x1="555" y1="727" x2="555" y2="742" stroke="#5a8a58" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- No label + arrow right to grey box -->
  <text x="680" y="693" font-size="11" fill="#666">No</text>
  <line x1="675" y1="697" x2="894" y2="697" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Right col — not_recognized (grey) -->
  <rect x="900" y="668" width="240" height="58" fill="#d0cbc4" stroke="#a8a09a" stroke-width="1.5" rx="4"/>
  <text x="1020" y="691" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">person = ['not_recognized']</text>
  <text x="1020" y="711" text-anchor="middle" font-size="11" fill="#555">reprocess later after new faces added</text>

  <!-- not_recognized route → right edge (1140,697) → (1165,697) → joins audio track at x=1165 -->
  <polyline points="1140,697 1165,697" stroke="#888" stroke-width="1.5" fill="none"/>
  <!-- junction dot where not_recognized meets audio vertical track -->
  <circle cx="1165" cy="697" r="4" fill="#888"/>

  <!-- junction dot at merge point before INSERT -->
  <circle cx="1165" cy="771" r="4" fill="#888"/>

  <!-- Merged arrow: both bypass tracks → INSERT right edge -->
  <line x1="1165" y1="771" x2="820" y2="771" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       Box 10 — INSERT media_library (blue/DB)
  ═══════════════════════════════════════════ -->
  <rect x="290" y="743" width="530" height="58" fill="#97b3cc" stroke="#7a9ab8" stroke-width="1.5" rx="4"/>
  <text x="555" y="766" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">INSERT  media_library</text>
  <text x="555" y="786" text-anchor="middle" font-size="11" fill="#e8f0f8">PostgreSQL  ·  LXC 102  ·  ON CONFLICT (file_hash) DO NOTHING</text>

  <!-- arrow Box10 → Box11 -->
  <line x1="555" y1="801" x2="555" y2="819" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       Box 11 — Background: duration + resolution
  ═══════════════════════════════════════════ -->
  <rect x="290" y="820" width="530" height="58" fill="#d0cbc4" stroke="#a8a09a" stroke-width="1.5" rx="4"/>
  <text x="555" y="843" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Background: update duration + resolution</text>
  <text x="555" y="863" text-anchor="middle" font-size="11" fill="#555">ffprobe  ·  async after upload  ·  UPDATE media_library</text>

  <!-- arrow Box11 → END -->
  <line x1="555" y1="878" x2="555" y2="896" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════
       END pill
  ═══════════════════════════════════════════ -->
  <rect x="380" y="897" width="350" height="34" rx="18" fill="#1e2a3a"/>
  <text x="555" y="919" text-anchor="middle" font-size="14" font-weight="bold" fill="white">✓  Ingested</text>

  <!-- ═══════════════════════════════════════════
       Legend
  ═══════════════════════════════════════════ -->
  <rect x="30" y="820" width="220" height="110" fill="#fff" stroke="#d0cbc4" stroke-width="1" rx="6" opacity="0.85"/>
  <text x="140" y="840" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Legend</text>
  <rect x="44" y="850" width="18" height="12" fill="#e8ddd8" stroke="#d0cbc4" stroke-width="1" rx="2"/>
  <text x="70" y="861" font-size="11" fill="#444">Process step</text>
  <rect x="44" y="870" width="18" height="12" fill="#ebe5db" stroke="#c4b4a0" stroke-width="1" rx="2"/>
  <text x="70" y="881" font-size="11" fill="#444">Decision</text>
  <rect x="44" y="890" width="18" height="12" fill="#97b3cc" stroke="#7a9ab8" stroke-width="1" rx="2"/>
  <text x="70" y="901" font-size="11" fill="#444">Database write</text>
  <rect x="44" y="910" width="18" height="12" fill="#d0cbc4" stroke="#a8a09a" stroke-width="1" rx="2"/>
  <text x="70" y="921" font-size="11" fill="#444">Async / bypass</text>
  <rect x="148" y="850" width="18" height="12" fill="#b55e5e" stroke="#954040" stroke-width="1" rx="2"/>
  <text x="174" y="861" font-size="11" fill="#444">Error / skip</text>

</svg>
