<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BoBo Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 4vh 4vw; box-sizing: border-box; }
  #card { width: min(760px, 92vw); background: #fbf9f5; color: #222; border-radius: 18px;
    padding: 28px 30px; box-shadow: 0 12px 50px rgba(0,0,0,.5); }
  #card h1 { margin: 0 0 4px; font-size: 1.5rem; }
  #card .sub { color: #888; font-size: .9rem; margin-bottom: 16px; }
  /* the game overlay (created by bobo-game.js) covers everything, so this card only shows the menu */
</style>
</head>
<body>
  <div id="wrap">
    <div id="card">
      <h1>🎮 BoBo Game</h1>
      <div class="sub">Balcony TV · lean on the board to play</div>
      <div id="bobo-root">loading…</div>
    </div>
  </div>

  <script>
    // Host config: point the shared shell at THIS LXC service (laptop-independent).
    window.BOBO_CFG = {
      autostart:    true,                 // TV context → honor the configured Auto/Manual mode
      mqttPass:     '/api/bobo/mqtt-pass',
      players:      '/api/bobo/players',
      settingsGet:  '/api/bobo/settings',
      settingsPost: '/api/bobo/settings',
      recent:       '/api/bobo/recent',
      saveScore:    '/api/bobo/score',
      broker:       'ws://192.168.1.189:9001',
      mqttUser:     'dashboard_browser',
      posTopic:     'mur/home/esp/balcony_bridge/pos',
    };
  </script>
  <script src="mqtt.min.js"></script>
  <script src="bobo-game.js"></script>
  <script>
    if (window.boboGameInit) window.boboGameInit();
    else window.addEventListener('DOMContentLoaded', function () { window.boboGameInit && window.boboGameInit(); });
  </script>
</body>
</html>
