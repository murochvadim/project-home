<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Agent</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Stats bar (same as device agent) ── */
    .device-stats { display:flex; gap:12px; margin-bottom:4px; flex-wrap:wrap; }
    .stat-chip { background:#f0ebe3; border:1px solid #d0cbc4; border-radius:8px; padding:8px 16px; display:flex; flex-direction:column; align-items:center; min-width:90px; }
    .stat-chip .stat-val { font-size:1.5rem; font-weight:700; color:#2e2e2e; }
    .stat-chip .stat-lbl { font-size:0.72rem; color:#888; text-transform:uppercase; letter-spacing:.04em; }

    /* ── Status colors ── */
    .mode-active .stat-val { color:#1a7a3a; }
    .mode-idle .stat-val   { color:#f39c12; }
    .mode-away .stat-val   { color:#95a5a6; }
    .people-0 .stat-val    { color:#95a5a6; }
    .people-1 .stat-val    { color:#2980b9; }
    .people-multi .stat-val { color:#1a7a3a; }
    .rooms-active .stat-val { color:#2980b9; }

    /* ── Tabs (same as device agent) ── */
    .tab-bar { display:flex; gap:0; margin-bottom:16px; border-bottom:2px solid #d0cbc4; }
    .tab-bar button {
      background:none; border:none; padding:8px 20px; cursor:pointer;
      font-size:0.9rem; color:#888; border-bottom:2px solid transparent;
      margin-bottom:-2px; transition:color .15s, border-color .15s;
    }
    .tab-bar button:hover { color:#2e2e2e; }
    .tab-bar button.active { color:#2e2e2e; border-bottom-color:#3a5a8a; font-weight:600; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }

    /* ── Room grid ── */
    .room-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
    .room-chip {
      background:#f0ebe3; border:1px solid #d0cbc4; border-radius:8px;
      padding:12px 14px; text-align:center; font-size:0.85rem; color:#888;
      transition:all 0.3s;
    }
    .room-chip.occupied {
      background:rgba(39,174,96,0.12); border-color:#27ae60; color:#1a7a3a; font-weight:600;
    }
    .room-chip .room-dot {
      display:inline-block; width:8px; height:8px; border-radius:50%;
      margin-right:5px; vertical-align:middle; background:#ccc;
    }
    .room-chip.occupied .room-dot { background:#27ae60; }

    /* ── Engine status row ── */
    .engine-status-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
    .engine-item { font-size:0.82rem; color:#888; }
    .engine-item .val { color:#2e2e2e; font-weight:600; }
    .engine-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
    .engine-dot.online  { background:#27ae60; }
    .engine-dot.offline { background:#e74c3c; }

    /* ── Active rooms list ── */
    .room-pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .room-pill {
      background:rgba(39,174,96,0.12); color:#1a7a3a; border-radius:12px;
      padding:3px 10px; font-size:0.78rem; font-weight:600;
    }
  </style>
</head>
<body>

<nav id="sidebar">
  <div class="logo">Smart Home<a href="health.html" id="alert-indicator"></a></div>

  <div class="section-label">General</div>
  <a href="health.html">Project Health</a>
  <a href="network.html">Project Network</a>
  <a href="general.html">Weather</a>

  <div class="section-label">Agents</div>
  <a href="index.html">Boiler Agent</a>
  <a href="media.html">Media Agent</a>
  <a href="devices.html">Device Agent</a>
  <a href="main-agent.html" class="active">Main Agent</a>

  <div class="section-label">Voice</div>
  <a href="voice.html">Voice</a>
</nav>

<main id="content">
  <div class="page-header">
    <h1>Main Agent</h1>
    <div class="refresh-bar">
      <span id="last-refresh" style="font-size:0.8rem;color:#888;margin-right:8px;">—</span>
      <button class="btn btn-secondary btn-sm" onclick="loadState()">&#8634; Refresh</button>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="device-stats">
    <div class="stat-chip" id="chip-mode">
      <span class="stat-val" id="home-mode">—</span>
      <span class="stat-lbl">Home</span>
    </div>
    <div class="stat-chip" id="chip-people">
      <span class="stat-val" id="people-count">—</span>
      <span class="stat-lbl">People</span>
    </div>
    <div class="stat-chip" id="chip-rooms">
      <span class="stat-val" id="active-room-count">—</span>
      <span class="stat-lbl">Active Rooms</span>
    </div>
    <div class="stat-chip">
      <span class="stat-val" id="last-motion-room" style="font-size:1rem;">—</span>
      <span class="stat-lbl">Last Motion</span>
    </div>
    <div class="stat-chip">
      <span class="stat-val" id="last-motion-ago" style="font-size:1rem;">—</span>
      <span class="stat-lbl">Motion Ago</span>
    </div>
  </div>

  <!-- Engine status -->
  <div class="engine-status-row">
    <span class="engine-item"><span class="engine-dot" id="engine-dot"></span><span class="val" id="engine-label">—</span></span>
    <span class="engine-item">Activity: <span class="val" id="activity-level">—</span></span>
    <span class="engine-item">Heartbeat: <span class="val" id="last-heartbeat">—</span></span>
    <span class="engine-item">Rules: <span class="val" id="last-decision">—</span></span>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="active" onclick="switchTab('overview',this)">Overview</button>
    <button onclick="switchTab('rooms',this)">Room Map</button>
  </div>

  <!-- Overview tab -->
  <div id="tab-overview" class="tab-content active">
    <div class="card">
      <h2>Active Rooms</h2>
      <div class="room-pills" id="active-room-list"></div>
      <div style="margin-top:12px;color:#888;font-size:0.8rem;" id="occupied-label"></div>
    </div>
  </div>

  <!-- Room Map tab -->
  <div id="tab-rooms" class="tab-content">
    <div class="card">
      <h2>Room Occupancy</h2>
      <div class="room-grid" id="room-grid">
        <div style="color:#aaa">Loading...</div>
      </div>
    </div>
  </div>

</main>

<script src="js/scroll-stabilizer.js"></script>
<script src="js/alerts-monitor.js"></script>
<script src="js/main-agent.js"></script>
</body>
</html>
