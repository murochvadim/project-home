<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" font-family="Segoe UI, sans-serif">

  <!-- Background -->
  <rect width="900" height="820" fill="#faf8f5"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e2a3a">Voice Response Style — All Possibilities</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#888">Custom text OFF = generated response · Custom text ON = your text replaces the response</text>

  <!-- ── Column headers ── -->
  <rect x="20" y="72" width="860" height="32" fill="#1e2a3a" rx="5"/>
  <text x="110" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#cdd8e3">Style</text>
  <text x="340" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#cdd8e3">Custom Text OFF</text>
  <text x="680" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#cdd8e3">Custom Text ON</text>
  <line x1="210" y1="72" x2="210" y2="104" stroke="#2e3f54" stroke-width="1"/>
  <line x1="470" y1="72" x2="470" y2="104" stroke="#2e3f54" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ROW 1: Short -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="20" y="104" width="860" height="140" fill="#f0ebe3" rx="0"/>
  <rect x="20" y="104" width="860" height="140" fill="none" stroke="#d0cbc4" stroke-width="1"/>

  <!-- Style label -->
  <rect x="30" y="114" width="80" height="24" fill="#7a9ab8" rx="10"/>
  <text x="70" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">SHORT</text>
  <text x="110" y="162" text-anchor="middle" font-size="10" fill="#666">Act immediately</text>
  <text x="110" y="176" text-anchor="middle" font-size="10" fill="#666">One-line answer</text>
  <text x="110" y="190" text-anchor="middle" font-size="10" fill="#666">No confirmation</text>

  <line x1="210" y1="104" x2="210" y2="244" stroke="#d0cbc4" stroke-width="1"/>

  <!-- Custom OFF -->
  <text x="220" y="126" font-size="10" fill="#888">Example: "Can I shower?"</text>
  <rect x="220" y="132" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="230" y="147" font-size="10" fill="#2a6a2a">▶ System acts immediately</text>
  <rect x="220" y="158" width="240" height="22" fill="#e8ddd8" rx="4"/>
  <text x="230" y="173" font-size="10" fill="#555">🔊 "Shower ready, boiler is 47°C"</text>
  <text x="220" y="206" font-size="10" fill="#888">Example: "Turn on kitchen light"</text>
  <rect x="220" y="212" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="230" y="227" font-size="10" fill="#2a6a2a">▶ Light turns on</text>

  <line x1="470" y1="104" x2="470" y2="244" stroke="#d0cbc4" stroke-width="1"/>

  <!-- Custom ON -->
  <text x="480" y="120" font-size="10" fill="#888">Custom response text: <tspan font-style="italic">"בוצע!"</tspan></text>
  <text x="480" y="138" font-size="10" fill="#888">Example: "Can I shower?"</text>
  <rect x="480" y="144" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="490" y="159" font-size="10" fill="#2a6a2a">▶ System acts immediately</text>
  <rect x="480" y="170" width="240" height="22" fill="#e8ddd8" rx="4"/>
  <text x="490" y="185" font-size="10" fill="#555">🔊 "בוצע!" (your custom text)</text>
  <text x="480" y="208" font-size="10" fill="#888">Example: "Turn on kitchen light"</text>
  <rect x="480" y="214" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="490" y="229" font-size="10" fill="#2a6a2a">▶ Light turns on → 🔊 "בוצע!"</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ROW 2: Full -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="20" y="244" width="860" height="150" fill="#fff" rx="0"/>
  <rect x="20" y="244" width="860" height="150" fill="none" stroke="#d0cbc4" stroke-width="1"/>

  <rect x="30" y="254" width="80" height="24" fill="#8a9f78" rx="10"/>
  <text x="70" y="271" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">FULL</text>
  <text x="110" y="296" text-anchor="middle" font-size="10" fill="#666">Act immediately</text>
  <text x="110" y="310" text-anchor="middle" font-size="10" fill="#666">Full details in answer</text>
  <text x="110" y="324" text-anchor="middle" font-size="10" fill="#666">No confirmation</text>

  <line x1="210" y1="244" x2="210" y2="394" stroke="#d0cbc4" stroke-width="1"/>

  <text x="220" y="266" font-size="10" fill="#888">Example: "Can I shower?"</text>
  <rect x="220" y="272" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="230" y="287" font-size="10" fill="#2a6a2a">▶ System acts immediately</text>
  <rect x="220" y="298" width="240" height="36" fill="#e8ddd8" rx="4"/>
  <text x="230" y="313" font-size="10" fill="#555">🔊 "Shower is ready. Boiler is 47°C,</text>
  <text x="230" y="327" font-size="10" fill="#555">     target was 45°C. Valve is open."</text>
  <text x="220" y="358" font-size="10" fill="#888">Example: "Turn on kitchen light"</text>
  <rect x="220" y="364" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="230" y="379" font-size="10" fill="#2a6a2a">▶ Light turns on</text>

  <line x1="470" y1="244" x2="470" y2="394" stroke="#d0cbc4" stroke-width="1"/>

  <text x="480" y="260" font-size="10" fill="#888">Custom response text: <tspan font-style="italic">"Ready! Go shower."</tspan></text>
  <text x="480" y="278" font-size="10" fill="#888">Example: "Can I shower?"</text>
  <rect x="480" y="284" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="490" y="299" font-size="10" fill="#2a6a2a">▶ System acts immediately</text>
  <rect x="480" y="310" width="240" height="22" fill="#e8ddd8" rx="4"/>
  <text x="490" y="325" font-size="10" fill="#555">🔊 "Ready! Go shower." (custom text)</text>
  <text x="480" y="356" font-size="10" fill="#888">(Full details ignored — custom replaces all)</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ROW 3: Short + Confirm -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="20" y="394" width="860" height="190" fill="#f0ebe3" rx="0"/>
  <rect x="20" y="394" width="860" height="190" fill="none" stroke="#d0cbc4" stroke-width="1"/>

  <rect x="30" y="404" width="140" height="24" fill="#c0874a" rx="10"/>
  <text x="100" y="421" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">SHORT + CONFIRM</text>
  <text x="110" y="450" text-anchor="middle" font-size="10" fill="#666">Ask yes/no first</text>
  <text x="110" y="464" text-anchor="middle" font-size="10" fill="#666">Act only on "yes"</text>
  <text x="110" y="478" text-anchor="middle" font-size="10" fill="#666">Short answer after</text>
  <text x="110" y="506" text-anchor="middle" font-size="10" fill="#888">Confirm question:</text>
  <text x="110" y="520" text-anchor="middle" font-size="10" font-style="italic" fill="#c0874a">"Want me to do it?"</text>
  <text x="110" y="534" text-anchor="middle" font-size="10" fill="#888">(customizable)</text>

  <line x1="210" y1="394" x2="210" y2="584" stroke="#d0cbc4" stroke-width="1"/>

  <text x="220" y="414" font-size="10" fill="#888">Example: "Turn on electric boiler"</text>
  <rect x="220" y="420" width="240" height="22" fill="#fff3e0" rx="4"/>
  <text x="230" y="435" font-size="10" fill="#c0874a">🔊 "Want me to do it?" (confirm Q)</text>
  <text x="220" y="454" font-size="10" fill="#888">You say: "Yes" / "כן" / "да"</text>
  <rect x="220" y="460" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="230" y="475" font-size="10" fill="#2a6a2a">▶ Boiler turns on</text>
  <rect x="220" y="486" width="240" height="22" fill="#e8ddd8" rx="4"/>
  <text x="230" y="501" font-size="10" fill="#555">🔊 "Done"</text>
  <text x="220" y="524" font-size="10" fill="#888">You say: "No" / anything else</text>
  <rect x="220" y="530" width="240" height="22" fill="#fde8e8" rx="4"/>
  <text x="230" y="545" font-size="10" fill="#a00">▶ Nothing happens, flag cleared</text>

  <line x1="470" y1="394" x2="470" y2="584" stroke="#d0cbc4" stroke-width="1"/>

  <text x="480" y="408" font-size="10" fill="#888">Custom confirm Q: <tspan font-style="italic">"להדליק את הדוד?"</tspan></text>
  <text x="480" y="424" font-size="10" fill="#888">Custom response: <tspan font-style="italic">"הדוד הודלק"</tspan></text>
  <text x="480" y="444" font-size="10" fill="#888">Example: "Turn on electric boiler"</text>
  <rect x="480" y="450" width="240" height="22" fill="#fff3e0" rx="4"/>
  <text x="490" y="465" font-size="10" fill="#c0874a">🔊 "להדליק את הדוד?" (custom Q)</text>
  <text x="480" y="486" font-size="10" fill="#888">You say: "כן"</text>
  <rect x="480" y="492" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="490" y="507" font-size="10" fill="#2a6a2a">▶ Boiler turns on</text>
  <rect x="480" y="518" width="240" height="22" fill="#e8ddd8" rx="4"/>
  <text x="490" y="533" font-size="10" fill="#555">🔊 "הדוד הודלק" (custom response)</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ROW 4: Full + Confirm -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="20" y="584" width="860" height="216" fill="#fff" rx="0"/>
  <rect x="20" y="584" width="860" height="216" fill="none" stroke="#d0cbc4" stroke-width="1"/>

  <rect x="30" y="594" width="140" height="24" fill="#7a5aa0" rx="10"/>
  <text x="100" y="611" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">FULL + CONFIRM</text>
  <text x="110" y="638" text-anchor="middle" font-size="10" fill="#666">Ask yes/no first</text>
  <text x="110" y="652" text-anchor="middle" font-size="10" fill="#666">Act only on "yes"</text>
  <text x="110" y="666" text-anchor="middle" font-size="10" fill="#666">Full details after</text>
  <text x="110" y="694" text-anchor="middle" font-size="10" fill="#888">Best for:</text>
  <text x="110" y="708" text-anchor="middle" font-size="10" fill="#7a5aa0">Electric boiler</text>
  <text x="110" y="722" text-anchor="middle" font-size="10" fill="#7a5aa0">AC / Heater</text>
  <text x="110" y="736" text-anchor="middle" font-size="10" fill="#7a5aa0">Any costly action</text>

  <line x1="210" y1="584" x2="210" y2="800" stroke="#d0cbc4" stroke-width="1"/>

  <text x="220" y="604" font-size="10" fill="#888">Example: "Prepare bath"</text>
  <rect x="220" y="610" width="240" height="22" fill="#fff3e0" rx="4"/>
  <text x="230" y="625" font-size="10" fill="#c0874a">🔊 "Want me to do it?"</text>
  <text x="220" y="644" font-size="10" fill="#888">You say: "Yes"</text>
  <rect x="220" y="650" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="230" y="665" font-size="10" fill="#2a6a2a">▶ Electric boiler turns on</text>
  <rect x="220" y="676" width="240" height="44" fill="#e8ddd8" rx="4"/>
  <text x="230" y="691" font-size="10" fill="#555">🔊 "Electric boiler on. Boiler is 36°C,</text>
  <text x="230" y="705" font-size="10" fill="#555">     need 50°C. Est. wait: ~56 min."</text>
  <text x="220" y="736" font-size="10" fill="#888">You say: "No"</text>
  <rect x="220" y="742" width="240" height="22" fill="#fde8e8" rx="4"/>
  <text x="230" y="757" font-size="10" fill="#a00">▶ Nothing happens</text>

  <line x1="470" y1="584" x2="470" y2="800" stroke="#d0cbc4" stroke-width="1"/>

  <text x="480" y="598" font-size="10" fill="#888">Custom confirm Q: <tspan font-style="italic">"Prepare bath now?"</tspan></text>
  <text x="480" y="614" font-size="10" fill="#888">Custom response: <tspan font-style="italic">"On it! ~56 min."</tspan></text>
  <text x="480" y="634" font-size="10" fill="#888">Example: "Prepare bath"</text>
  <rect x="480" y="640" width="240" height="22" fill="#fff3e0" rx="4"/>
  <text x="490" y="655" font-size="10" fill="#c0874a">🔊 "Prepare bath now?" (custom Q)</text>
  <text x="480" y="676" font-size="10" fill="#888">You say: "Yes"</text>
  <rect x="480" y="682" width="240" height="22" fill="#e8f0e8" rx="4"/>
  <text x="490" y="697" font-size="10" fill="#2a6a2a">▶ Electric boiler turns on</text>
  <rect x="480" y="708" width="240" height="22" fill="#e8ddd8" rx="4"/>
  <text x="490" y="723" font-size="10" fill="#555">🔊 "On it! ~56 min." (custom resp.)</text>
  <text x="480" y="750" font-size="10" fill="#888">You say: "No"</text>
  <rect x="480" y="756" width="240" height="22" fill="#fde8e8" rx="4"/>
  <text x="490" y="771" font-size="10" fill="#a00">▶ Nothing happens</text>

  <!-- Footer note -->
  <rect x="20" y="800" width="860" height="18" fill="#e8e2da" rx="0"/>
  <text x="450" y="813" text-anchor="middle" font-size="10" fill="#666">Custom text active toggle: save text but temporarily disable it without clearing — switch back anytime</text>

</svg>
