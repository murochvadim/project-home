<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Media</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav id="sidebar">
  <div class="logo">Smart Home<a href="health.html" id="alert-indicator"></a></div>

  <div class="section-label">General</div>
  <a href="health.html">Project Health</a>
  <a href="network.html">Project Network</a>
  <a href="media.html" class="active">Project Media</a>
  <a href="general.html">Weather</a>

  <div class="section-label">Agents</div>
  <a href="index.html">Boiler Agent</a>

  <a href="voice.html">Voice</a>

  <div class="section-label" style="margin-top:auto; padding-top:32px;">Future Agents</div>
  <a href="#" style="opacity:0.4; pointer-events:none;">— coming soon —</a>
</nav>

<main id="content">
  <div class="page-header">
    <h1>Project Media</h1>
    <div class="refresh-bar">
      <span id="last-refresh">—</span>
      <button class="btn btn-secondary btn-sm" onclick="refreshState()">↺ Refresh</button>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('control', this)">Control</button>
  </div>

  <!-- TAB: Control -->
  <div class="tab-panel active" id="tab-control">

    <!-- TV -->
    <div class="card">
      <h2>Samsung 85" QLED</h2>
      <div style="display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap;">

        <!-- Status -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Status</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center;">
            <div id="tv-status" style="font-size:2rem;">—</div>
          </div>
        </div>

        <div style="width:1px; height:80px; background:#d0cbc4; margin-top:2rem;"></div>

        <!-- Power -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Power</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center; gap:8px;">
            <button class="btn btn-success btn-sm" onclick="cmd('tv','turn_on')">ON</button>
            <button class="btn btn-secondary btn-sm" onclick="cmd('tv','turn_off')">OFF</button>
          </div>
        </div>

        <div style="width:1px; height:80px; background:#d0cbc4; margin-top:2rem;"></div>

        <!-- Volume -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Volume</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center; gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="cmd('tv','volume_down')">▼</button>
            <span id="tv-volume" style="font-size:1.1rem; font-weight:600; min-width:36px; text-align:center;">—</span>
            <button class="btn btn-secondary btn-sm" onclick="cmd('tv','volume_up')">▲</button>
          </div>
        </div>

        <div style="width:1px; height:80px; background:#d0cbc4; margin-top:2rem;"></div>

        <!-- Mute -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Mute</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center;">
            <button id="tv-mute-btn" class="btn btn-secondary btn-sm" onclick="toggleMute('tv')">🔇</button>
          </div>
        </div>

        <div style="width:1px; height:80px; background:#d0cbc4; margin-top:2rem;"></div>

        <!-- Source -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Source</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center;">
            <button class="btn btn-secondary btn-sm" onclick="cmd('tv','key','KEY_SOURCE')">⎘ Source</button>
          </div>
        </div>

      </div>
    </div>

    <!-- Soundbar -->
    <div class="card">
      <h2>Samsung Soundbar HW-Q990C</h2>
      <div style="display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap;">

        <!-- Status -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Status</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center;">
            <div id="sb-status" style="font-size:2rem;">—</div>
          </div>
        </div>

        <div style="width:1px; height:80px; background:#d0cbc4; margin-top:2rem;"></div>

        <!-- Power -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Power</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center; gap:8px;">
            <button class="btn btn-success btn-sm" onclick="cmd('soundbar','turn_on')">ON</button>
            <button class="btn btn-secondary btn-sm" onclick="cmd('soundbar','turn_off')">OFF</button>
          </div>
        </div>

        <div style="width:1px; height:80px; background:#d0cbc4; margin-top:2rem;"></div>

        <!-- Volume -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Volume</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center; gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="cmd('soundbar','volume_down')">▼</button>
            <span id="sb-volume" style="font-size:1.1rem; font-weight:600; min-width:36px; text-align:center;">—</span>
            <button class="btn btn-secondary btn-sm" onclick="cmd('soundbar','volume_up')">▲</button>
          </div>
        </div>

        <div style="width:1px; height:80px; background:#d0cbc4; margin-top:2rem;"></div>

        <!-- Mute -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Mute</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center;">
            <button id="sb-mute-btn" class="btn btn-secondary btn-sm" onclick="toggleMute('soundbar')">🔇</button>
          </div>
        </div>

        <div style="width:1px; height:80px; background:#d0cbc4; margin-top:2rem;"></div>

        <!-- Source -->
        <div style="text-align:center;">
          <div style="font-size:0.75rem; color:#888; height:2rem; display:flex; align-items:center; justify-content:center;">Source</div>
          <div style="height:3rem; display:flex; align-items:center; justify-content:center;">
            <select id="sb-source-select" onchange="cmd('soundbar','source',this.value)" style="padding:4px 8px; border:1px solid #d0cbc4; border-radius:4px; font-size:0.82rem;">
              <option>—</option>
            </select>
          </div>
        </div>

      </div>
    </div>

    <!-- Feedback -->
    <div id="cmd-feedback" style="display:none; margin-top:4px; padding:8px 14px; border-radius:4px; font-size:0.82rem;"></div>

  </div><!-- /tab-control -->

</main>

<script src="js/alerts-monitor.js"></script>
<script src="js/scroll-stabilizer.js"></script>
<script src="js/media.js"></script>
</body>
</html>
