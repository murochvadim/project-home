<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boiler — Compare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav id="sidebar">
  <div class="logo">Home Agents</div>

  <div class="section-label">Boiler Agent</div>
  <a href="index.html">Overview</a>
  <a href="graph.html">Graph</a>
  <a href="data.html">Data</a>
  <a href="compare.html" class="active">Compare</a>

  <div class="section-label" style="margin-top:auto; padding-top:32px;">Future Agents</div>
  <a href="#" style="opacity:0.4; pointer-events:none;">— coming soon —</a>
</nav>

<main id="content">
  <div class="page-header">
    <h1>Version Comparison</h1>
  </div>

  <div class="card">
    <h2>Select Versions</h2>
    <div class="compare-controls">
      <div class="form-group">
        <label>Version A</label>
        <select id="version-a" class="compare-select"></select>
      </div>
      <div class="form-group">
        <label>Version B</label>
        <select id="version-b" class="compare-select"></select>
      </div>
      <button class="btn btn-primary btn-sm" onclick="loadCompare()">Compare</button>
    </div>

    <div id="compare-result" style="display:none;">
      <table class="compare-table">
        <thead>
          <tr>
            <th>Metric</th>
            <th id="head-a">Version A</th>
            <th id="head-b">Version B</th>
          </tr>
        </thead>
        <tbody id="compare-body"></tbody>
      </table>
    </div>

    <div id="compare-error" style="color:#e74c3c; font-size:0.85rem; margin-top:10px;"></div>
  </div>
</main>

<script src="js/compare.js"></script>
</body>
</html>
