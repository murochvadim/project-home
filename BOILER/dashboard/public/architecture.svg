<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Segoe UI, Arial, sans-serif">

  <rect width="1100" height="580" fill="#f5f2ee"/>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#3a3028">Smart Home — Voice Control Flow</text>

  <!-- ═══════════════════════════════ -->
  <!-- STEP 1 — MIC (multi-room) -->
  <!-- ═══════════════════════════════ -->
  <rect x="30" y="60" width="160" height="110" rx="10" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="110" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1a5276">Mic Satellite</text>
  <text x="110" y="103" text-anchor="middle" font-size="11" fill="#555">XMOS XVF3800</text>
  <text x="110" y="119" text-anchor="middle" font-size="10" fill="#888">noise cancel + AEC</text>
  <text x="110" y="135" text-anchor="middle" font-size="11" fill="#555">RPi Zero 2W</text>
  <text x="110" y="151" text-anchor="middle" font-size="10" fill="#888">one per room</text>

  <!-- multi-room hint -->
  <rect x="36" y="66" width="160" height="110" rx="10" fill="none" stroke="#2980b9" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <rect x="42" y="72" width="160" height="110" rx="10" fill="none" stroke="#2980b9" stroke-width="1" stroke-dasharray="4,3" opacity="0.2"/>

  <!-- label -->
  <text x="110" y="185" text-anchor="middle" font-size="10" fill="#2980b9">multiple rooms</text>

  <!-- Arrow 1 → 2 -->
  <line x1="190" y1="115" x2="240" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="215" y="108" text-anchor="middle" font-size="10" fill="#555">audio</text>
  <text x="215" y="130" text-anchor="middle" font-size="9" fill="#888">Wyoming/LAN</text>

  <!-- ═══════════════════════════════ -->
  <!-- STEP 2 — WHISPER (LXC 105) -->
  <!-- ═══════════════════════════════ -->
  <rect x="240" y="60" width="160" height="110" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="320" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">LXC 105</text>
  <text x="320" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#1e8449">Whisper STT</text>
  <text x="320" y="121" text-anchor="middle" font-size="10" fill="#555">faster-whisper large-v3</text>
  <text x="320" y="137" text-anchor="middle" font-size="10" fill="#555">Hebrew · Russian · English</text>
  <text x="320" y="155" text-anchor="middle" font-size="10" fill="#c0392b">★ to install</text>

  <!-- Arrow 2 → 3 -->
  <line x1="400" y1="115" x2="450" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="425" y="108" text-anchor="middle" font-size="10" fill="#555">text</text>
  <text x="425" y="130" text-anchor="middle" font-size="9" fill="#888">any language</text>

  <!-- ═══════════════════════════════ -->
  <!-- STEP 3 — CLAUDE API -->
  <!-- ═══════════════════════════════ -->
  <rect x="450" y="60" width="160" height="110" rx="10" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="530" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#784212">Claude API</text>
  <text x="530" y="103" text-anchor="middle" font-size="11" fill="#784212">Intent extraction</text>
  <text x="530" y="121" text-anchor="middle" font-size="10" fill="#555">"רוצה להתקלח"</text>
  <text x="530" y="137" text-anchor="middle" font-size="10" fill="#555">→ {intent: "shower"}</text>
  <text x="530" y="155" text-anchor="middle" font-size="10" fill="#888">Anthropic cloud</text>

  <!-- Arrow 3 → 4 -->
  <line x1="610" y1="115" x2="660" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="635" y="108" text-anchor="middle" font-size="10" fill="#555">JSON</text>
  <text x="635" y="130" text-anchor="middle" font-size="9" fill="#888">intent + params</text>

  <!-- ═══════════════════════════════ -->
  <!-- STEP 4 — REQUEST HANDLER (LXC 104) -->
  <!-- ═══════════════════════════════ -->
  <rect x="660" y="60" width="160" height="110" rx="10" fill="#e8daef" stroke="#8e44ad" stroke-width="2"/>
  <text x="740" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#512e5f">LXC 104</text>
  <text x="740" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#512e5f">Request Handler</text>
  <text x="740" y="118" text-anchor="middle" font-size="10" fill="#555">executes instantly</text>
  <text x="740" y="134" text-anchor="middle" font-size="10" fill="#555">monitors long tasks</text>
  <text x="740" y="150" text-anchor="middle" font-size="10" fill="#555">logs to DB</text>

  <!-- Arrow 4 → 5 -->
  <line x1="820" y1="115" x2="870" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="845" y="108" text-anchor="middle" font-size="10" fill="#555">HA API</text>
  <text x="845" y="130" text-anchor="middle" font-size="9" fill="#888">REST call</text>

  <!-- ═══════════════════════════════ -->
  <!-- STEP 5 — HOME ASSISTANT -->
  <!-- ═══════════════════════════════ -->
  <rect x="870" y="60" width="160" height="110" rx="10" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="950" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1a5276">Home Assistant</text>
  <text x="950" y="103" text-anchor="middle" font-size="11" fill="#555">All devices</text>
  <text x="950" y="121" text-anchor="middle" font-size="10" fill="#888">lights · boiler · climate</text>
  <text x="950" y="137" text-anchor="middle" font-size="10" fill="#888">media · sensors</text>
  <text x="950" y="155" text-anchor="middle" font-size="10" fill="#888">192.168.1.110</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- RESPONSE PATH (bottom) -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- title -->
  <text x="550" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#888">── Response path ──</text>

  <!-- HA → Request Handler (status/temp) feedback arrow curved below -->
  <path d="M 950 170 Q 950 215 740 215" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrb)"/>
  <text x="870" y="208" text-anchor="middle" font-size="10" fill="#2980b9">temp / status</text>

  <!-- Request Handler → Piper TTS -->
  <line x1="740" y1="170" x2="740" y2="255" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrp)"/>
  <text x="755" y="215" font-size="10" fill="#8e44ad">response</text>
  <text x="755" y="228" font-size="10" fill="#8e44ad">text</text>

  <!-- ═══════════════════════════════ -->
  <!-- PIPER TTS (LXC 105) -->
  <!-- ═══════════════════════════════ -->
  <rect x="660" y="255" width="160" height="90" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="740" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">LXC 105</text>
  <text x="740" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#1e8449">Piper TTS</text>
  <text x="740" y="313" text-anchor="middle" font-size="10" fill="#555">text → speech</text>
  <text x="740" y="329" text-anchor="middle" font-size="10" fill="#c0392b">★ to install</text>

  <!-- Piper → Speaker -->
  <line x1="660" y1="300" x2="450" y2="300" stroke="#27ae60" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="555" y="292" text-anchor="middle" font-size="10" fill="#27ae60">audio stream</text>

  <!-- ═══════════════════════════════ -->
  <!-- SPEAKER -->
  <!-- ═══════════════════════════════ -->
  <rect x="290" y="255" width="160" height="90" rx="10" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="370" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#1a5276">Speaker</text>
  <text x="370" y="297" text-anchor="middle" font-size="11" fill="#555">room speaker</text>
  <text x="370" y="313" text-anchor="middle" font-size="10" fill="#888">or Alexa as output</text>
  <text x="370" y="329" text-anchor="middle" font-size="10" fill="#555">"המתן 25 דקות"</text>

  <!-- multi-room hint for speaker -->
  <rect x="296" y="261" width="160" height="90" rx="10" fill="none" stroke="#2980b9" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- DB + DASHBOARD side boxes -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Request Handler → DB -->
  <line x1="740" y1="170" x2="530" y2="390" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- DB -->
  <rect x="420" y="390" width="155" height="90" rx="10" fill="#d6eaf8" stroke="#2e86c1" stroke-width="2"/>
  <text x="497" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#1a5276">PostgreSQL</text>
  <text x="497" y="431" text-anchor="middle" font-size="10" fill="#555">manual_requests</text>
  <text x="497" y="447" text-anchor="middle" font-size="10" fill="#555">raw_data · alerts</text>
  <text x="497" y="463" text-anchor="middle" font-size="10" fill="#888">LXC DB</text>

  <!-- Dashboard -->
  <rect x="620" y="390" width="155" height="90" rx="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="697" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#784212">Dashboard</text>
  <text x="697" y="431" text-anchor="middle" font-size="10" fill="#555">active request status</text>
  <text x="697" y="447" text-anchor="middle" font-size="10" fill="#555">cancel button</text>
  <text x="697" y="463" text-anchor="middle" font-size="10" fill="#888">localhost:3000</text>

  <!-- DB → Dashboard -->
  <line x1="575" y1="435" x2="620" y2="435" stroke="#2e86c1" stroke-width="1.5" marker-end="url(#arrb)"/>

  <!-- Notification box -->
  <rect x="820" y="390" width="155" height="90" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="897" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">Notification</text>
  <text x="897" y="431" text-anchor="middle" font-size="10" fill="#555">mobile push</text>
  <text x="897" y="447" text-anchor="middle" font-size="10" fill="#555">"shower ready"</text>
  <text x="897" y="463" text-anchor="middle" font-size="10" fill="#888">HA companion app</text>

  <!-- Request Handler → Notification -->
  <line x1="820" y1="170" x2="897" y2="390" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrg)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- EXAMPLE BUBBLE -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="30" y="255" width="220" height="120" rx="10" fill="#fffbf0" stroke="#f39c12" stroke-width="1.5"/>
  <text x="140" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">Example: shower request</text>
  <text x="140" y="295" text-anchor="middle" font-size="10" fill="#555">You: "אני רוצה להתקלח"</text>
  <text x="140" y="311" text-anchor="middle" font-size="10" fill="#555">→ temp checked: 36°C</text>
  <text x="140" y="327" text-anchor="middle" font-size="10" fill="#555">→ electric boiler ON</text>
  <text x="140" y="343" text-anchor="middle" font-size="10" fill="#555">→ "המתן 25 דקות"</text>
  <text x="140" y="359" text-anchor="middle" font-size="10" fill="#27ae60">→ notified when ready ✓</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- STEP NUMBERS -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <circle cx="110" cy="58" r="11" fill="#2980b9"/>
  <text x="110" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>

  <circle cx="320" cy="58" r="11" fill="#27ae60"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>

  <circle cx="530" cy="58" r="11" fill="#e67e22"/>
  <text x="530" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>

  <circle cx="740" cy="58" r="11" fill="#8e44ad"/>
  <text x="740" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>

  <circle cx="950" cy="58" r="11" fill="#2980b9"/>
  <text x="950" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="30" y="500" width="1040" height="60" rx="8" fill="#eee" stroke="#ccc"/>
  <text x="50" y="520" font-size="11" font-weight="700" fill="#333">Hardware to buy:</text>
  <text x="50" y="538" font-size="11" fill="#555">XMOS XVF3800 (~$50) + RPi Zero 2W (~$15) per room   |   Everything else runs on your existing Proxmox mini PC (52GB RAM free)</text>
  <text x="50" y="554" font-size="11" fill="#c0392b">★ To install on Proxmox:  LXC 105 (wyoming-faster-whisper + Piper TTS)  ·  LXC 104 additions (Claude intent layer + request handler)  ·  DB table: manual_requests</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- ARROW MARKERS -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2980b9"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
    <marker id="arrp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/>
    </marker>
  </defs>

</svg>
