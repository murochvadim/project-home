<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boiler Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav id="sidebar">
  <div class="logo">Home Agents</div>

  <div class="section-label">General</div>
  <a href="general.html">Weather</a>

  <div class="section-label">Boiler Agent</div>
  <a href="index.html" class="active">Overview</a>
  <a href="graph.html">Graph</a>
  <a href="data.html">Data</a>
  <a href="compare.html">Compare</a>
  <a href="logic.html">Logic</a>

  <div class="section-label" style="margin-top:auto; padding-top:32px;">Future Agents</div>
  <a href="#" style="opacity:0.4; pointer-events:none;">— coming soon —</a>
</nav>

<main id="content">
  <div class="page-header">
    <h1>Boiler Agent</h1>
    <div class="refresh-bar">
      <span id="last-refresh">—</span>
      <button class="btn btn-secondary btn-sm" onclick="refreshAll()">↺ Refresh</button>
    </div>
  </div>

  <!-- Agent control -->
  <div class="card">
    <h2>Agent Control</h2>
    <div class="status-grid">
      <div class="status-item">
        <label>Agent Status</label>
        <div class="value" id="agent-status">—</div>
      </div>
      <div class="status-item">
        <label>Last Decision</label>
        <div class="value small" id="last-decision">—</div>
        <div id="why-decision" style="font-size:0.82rem; color:#777; margin-top:4px; font-style:italic; line-height:1.4;">—</div>
      </div>
      <div class="status-item">
        <label>Next Run</label>
        <div class="value small" id="next-run">—</div>
        <div id="next-run-countdown" style="font-size:0.78rem; color:#7a9ab8; margin-top:3px; font-variant-numeric:tabular-nums;"></div>
      </div>
      <div class="status-item">
        <label>Next Probe Run</label>
        <div class="value small" id="next-probe">—</div>
        <div id="next-probe-countdown" style="font-size:0.82rem; color:#7a9ab8; margin-top:3px; font-variant-numeric:tabular-nums;"></div>
        <div id="turn-on-origin" style="font-size:0.75rem; margin-top:4px;"></div>
      </div>
      <div class="status-item">
        <label>Last Error</label>
        <div class="value small" id="last-error">—</div>
      </div>
      <div class="status-item">
        <label>Connections</label>
        <div style="display:flex; flex-direction:column; gap:5px; margin-top:4px; font-size:0.78rem;">
          <span><span id="status-db">⬤</span> PostgreSQL</span>
          <span><span id="status-ha">⬤</span> Home Assistant</span>
        </div>
      </div>
    </div>
    <div style="margin-top:16px;">
      <button class="btn btn-sm btn-primary" id="toggle-btn" onclick="toggleAgent()">Loading…</button>
    </div>
  </div>

  <!-- Last report -->
  <div class="card">
    <h2>Last Report</h2>
    <div class="status-grid">
      <div class="status-item">
        <label>Boiler Temp</label>
        <div class="value" id="boiler-temp">—</div>
      </div>
      <div class="status-item">
        <label>Panel Temp</label>
        <div class="value" id="panel-temp">—</div>
      </div>
      <div class="status-item">
        <label>Valve State</label>
        <div class="value" id="valve-state">—</div>
      </div>
      <div class="status-item">
        <label>Boiler Trend</label>
        <div class="value small" id="boiler-trend">—</div>
      </div>
      <div class="status-item">
        <label>Panel Trend</label>
        <div class="value small" id="panel-trend">—</div>
      </div>
      <div class="status-item">
        <label>Report Time</label>
        <div class="value small" id="report-ts">—</div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="card">
    <h2>Settings</h2>
    <form id="settings-form" onsubmit="saveSettings(event)">
      <div class="settings-grid">
        <div class="form-group">
          <label>Run Interval (min)</label>
          <input type="number" id="s-run-interval" min="1" max="60">
        </div>
        <div class="form-group">
          <label>Temp Panel Valid After ON (min)</label>
          <input type="number" id="s-valid-after-on" min="0">
        </div>
        <div class="form-group">
          <label>Temp Panel Valid After OFF (min)</label>
          <input type="number" id="s-valid-after-off" min="0">
        </div>
        <div class="form-group">
          <label>Num Trend Runs</label>
          <input type="number" id="s-trend-runs" min="1">
        </div>
        <div class="form-group">
          <label>Temp Debounce (°C)</label>
          <input type="number" id="s-debounce" min="0" step="0.5">
        </div>
        <div class="form-group">
          <label>Probe Interval (min)</label>
          <input type="number" id="s-probe-interval" min="1">
        </div>
      </div>
      <div style="margin-top:14px;">
        <button type="submit" class="btn btn-success btn-sm">Save Settings</button>
        <span id="settings-msg" style="margin-left:10px; font-size:0.82rem; color:#2ecc71;"></span>
      </div>
    </form>
  </div>

  <!-- Deploy -->
  <div class="card">
    <h2>Deploy</h2>
    <button class="btn btn-danger btn-sm" onclick="deploy()">Deploy to Production</button>
    <div id="deploy-output"></div>
  </div>
</main>

<script src="js/main.js"></script>
</body>
</html>
