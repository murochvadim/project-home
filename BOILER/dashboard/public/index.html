<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boiler Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tab-btn {
      padding: 7px 20px;
      border: 1px solid #d0cbc4;
      border-radius: 4px;
      background: #f0ebe6;
      color: #555;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover  { background: #e8ddd8; }
    .tab-btn.active { background: #7a9ab8; color: #fff; border-color: #7a9ab8; }
    .tab-panel      { display: none; }
    .tab-panel.active { display: block; }
    .tab-bar        { display: flex; gap: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>

<nav id="sidebar">
  <div class="logo">Smart Home<a href="health.html" id="alert-indicator"></a></div>

  <div class="section-label">General</div>
  <a href="health.html">Project Health</a>
  <a href="general.html">Weather</a>

  <div class="section-label">Boiler Agent</div>
  <a href="index.html" class="active">Overview</a>
  <a href="graph.html">AI + Graph</a>
  <a href="data.html">Data</a>
  <a href="logic.html">Logic</a>

  <div class="section-label" style="margin-top:auto; padding-top:32px;">Future Agents</div>
  <a href="#" style="opacity:0.4; pointer-events:none;">— coming soon —</a>
</nav>

<main id="content">
  <div class="page-header">
    <h1>Boiler Agent</h1>
    <div class="refresh-bar">
      <span id="last-refresh">—</span>
      <button class="btn btn-secondary btn-sm" onclick="refreshAll()">↺ Refresh</button>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="showMainTab('overview', this)">Boiler Agent</button>
    <button class="tab-btn"        onclick="showMainTab('settings', this)">Settings</button>
  </div>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- TAB: Boiler Agent                                         -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <div class="tab-panel active" id="tab-overview">

    <!-- Agent control -->
    <div class="card">
      <h2><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7a9ab8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; margin-right:7px; margin-bottom:2px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Agent Control</h2>
      <div class="status-grid status-grid-divided" style="grid-template-columns: 0.7fr 2fr 1.3fr 1.3fr 0.7fr 1fr 1fr;">
        <div class="status-item" style="text-align:center;">
          <label>Agent Status</label>
          <button class="btn btn-sm btn-primary" id="toggle-btn" onclick="toggleAgent()" style="margin-top:28px; font-size:0.72rem; padding:11px 10px;">Loading…</button>
        </div>
        <div class="status-item">
          <label>Last Decision</label>
          <div class="value small" id="last-decision">—</div>
          <div id="why-decision" style="font-size:0.82rem; color:#777; margin-top:4px; font-style:italic; line-height:1.4;">—</div>
        </div>
        <div class="status-item" style="text-align:center;">
          <label>Next Run</label>
          <div class="value small" id="next-run">—</div>
          <div id="next-run-countdown" style="font-size:1.5rem; color:#085c28; margin-top:16px; font-variant-numeric:tabular-nums; font-weight:600; line-height:1;"></div>
        </div>
        <div class="status-item" style="text-align:center;">
          <label>Next Probe Run</label>
          <div class="value small" id="next-probe">—</div>
          <div id="next-probe-countdown" style="font-size:1.5rem; color:#7a9ab8; margin-top:16px; font-variant-numeric:tabular-nums; font-weight:600; line-height:1; white-space:nowrap;"></div>
          <div id="turn-on-origin" style="font-size:0.75rem; margin-top:4px; white-space:nowrap;"></div>
        </div>
        <div class="status-item">
          <label>Last Error</label>
          <div class="value small" id="last-error" style="white-space:nowrap; font-size:0.72rem; margin-top:12px;">—</div>
        </div>
        <div class="status-item" style="text-align:center;">
          <label>Solar Heating Potential</label>
          <div class="value small" id="solar-score" style="font-size:1.2rem;">—</div>
          <div id="solar-score-label" style="font-size:0.75rem; color:#888; margin-top:3px;"></div>
        </div>
        <div class="status-item">
          <label>Connections</label>
          <div style="display:flex; flex-direction:column; gap:5px; margin-top:4px; font-size:0.78rem;">
            <span><span id="status-db">⬤</span> PostgreSQL</span>
            <span><span id="status-ha">⬤</span> Home Assistant</span>
          </div>
          <label style="margin-top:10px;">Boiler Timer</label>
          <div style="margin-top:3px; font-size:0.78rem;">
            <span><span id="timer-state-dot">⬤</span> <span id="timer-state">—</span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Last report -->
    <div class="card">
      <h2>Last Report</h2>
      <div class="status-grid status-grid-divided" style="grid-template-columns: 0.7fr 2fr 1.3fr 1.3fr 0.7fr 1fr 1fr;">
        <div class="status-item">
          <label>Boiler Temp</label>
          <div class="value" id="boiler-temp">—</div>
        </div>
        <div class="status-item">
          <label>Panel Temp</label>
          <div class="value" id="panel-temp">—</div>
        </div>
        <div class="status-item" style="text-align:center;">
          <label>Valve State</label>
          <div class="value" id="valve-state">—</div>
        </div>
        <div class="status-item" style="text-align:center;">
          <label>Boiler Trend</label>
          <div class="value small" id="boiler-trend">—</div>
        </div>
        <div class="status-item" style="text-align:center;">
          <label>Panel Trend</label>
          <div class="value small" id="panel-trend">—</div>
        </div>
        <div class="status-item" style="text-align:center;">
          <label>Report Time</label>
          <div class="value small" id="report-ts">—</div>
        </div>
      </div>
    </div>

    <!-- Hot Water Usage -->
    <div class="card">
      <h2>Hot Water Usage — Today</h2>
      <div class="status-grid status-grid-divided" style="grid-template-columns: 0.7fr 2fr 1.3fr 1.3fr 0.7fr 1fr 1fr;">
        <div class="status-item" style="grid-column: 1;">
          <label>Events</label>
          <div class="value" id="usage-count">—</div>
        </div>
        <div class="status-item" style="grid-column: 3; border-left: 1px solid #d0cbc4; margin-left: -16px; padding-left: 16px; text-align: center;">
          <label>Largest Drop</label>
          <div class="value small" id="usage-max-drop">—</div>
        </div>
        <div class="status-item" style="grid-column: 4; text-align: center;">
          <label>Avg Drop</label>
          <div class="value small" id="usage-avg-drop">—</div>
        </div>
        <div class="status-item" style="grid-column: 5; text-align: center;">
          <label>Last Event</label>
          <div class="value small" id="usage-last-ts">—</div>
        </div>
      </div>
    </div>

  </div><!-- /tab-overview -->

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- TAB: Settings                                             -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-settings">

    <!-- Settings -->
    <div class="card">
      <h2>Settings</h2>
      <form id="settings-form" onsubmit="saveSettings(event)">
        <div class="settings-grid">
          <div class="form-group">
            <label>Run Interval (min)</label>
            <input type="number" id="s-run-interval" min="1" max="60">
          </div>
          <div class="form-group">
            <label>Temp Panel Valid After ON (min)</label>
            <input type="number" id="s-valid-after-on" min="0">
          </div>
          <div class="form-group">
            <label>Temp Panel Valid After OFF (min)</label>
            <input type="number" id="s-valid-after-off" min="0">
          </div>
          <div class="form-group">
            <label>Num Trend Runs</label>
            <input type="number" id="s-trend-runs" min="1">
          </div>
          <div class="form-group">
            <label>Temp Debounce (°C)</label>
            <input type="number" id="s-debounce" min="0" step="0.5">
          </div>
          <div class="form-group">
            <label>Probe Interval (min)</label>
            <input type="number" id="s-probe-interval" min="1">
          </div>
          <div class="form-group">
            <label>Consumption Temp Delta (°C)</label>
            <input type="number" id="s-consumption-temp" min="0.5" step="0.5">
          </div>
          <div class="form-group">
            <label>Consumption Time Delta (min)</label>
            <input type="number" id="s-consumption-time" min="1">
          </div>
        </div>
        <div style="margin-top:14px;">
          <button type="submit" class="btn btn-success btn-sm">Save Settings</button>
          <span id="settings-msg" style="margin-left:10px; font-size:0.82rem; color:#2ecc71;"></span>
        </div>
      </form>
    </div>

    <!-- Deploy -->
    <div class="card">
      <h2>Deploy</h2>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <select id="deploy-agent" style="font-size:0.85rem; border:1px solid #d0cbc4; border-radius:5px; padding:5px 10px; background:#faf8f5; color:#2e2e2e;">
          <option value="">Loading agents…</option>
        </select>
        <button class="btn btn-danger btn-sm" onclick="deploy()">Deploy to Production</button>
      </div>
      <div id="deploy-output"></div>
    </div>

  </div><!-- /tab-settings -->

</main>

<script>
function showMainTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}
</script>
<script src="js/alerts-monitor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
