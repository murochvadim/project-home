# /etc/apcupsd/recover.conf — auto-recovery gate settings
# Read by /etc/apcupsd/doshutdown_auto_recover at PVE boot.
# Format: shell key=value (sourced by bash). Comments allowed (#).

# Master switch. "yes" = auto-recover on next boot if marker file is present.
# "no"  = installed but disabled. Default OFF until we explicitly go live (Phase B4).
RECOVER_AUTO=no

# Don't auto-recover if UPS battery is below this %.
# Reason: mains may drop again before we have buffer.
RECOVER_MIN_BCHARGE=40

# Mains must report STATUS=ONLINE for at least this many seconds before
# recovery proceeds. Filters mains-flicker scenarios.
RECOVER_REQUIRE_ONLINE_SEC=120

# Wait this many seconds after PVE boot before starting any gate check.
# Lets system / network / apcupsd settle.
RECOVER_BOOT_DELAY_SEC=30

# If the marker file is older than this many hours, treat as zombie and
# delete + skip recovery. Protects against stale markers from old halts.
RECOVER_MARKER_MAX_AGE_HOURS=48
